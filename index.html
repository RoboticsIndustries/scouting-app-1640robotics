<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REBUILT Open Scout</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary: #ffeb3b; --bg: #0a0a0a; --card: #161616; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .nav { display: flex; background: #000; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
        .nav-item { flex: 1; padding: 15px; text-align: center; font-weight: bold; font-size: 0.75rem; color: #666; cursor: pointer; }
        .nav-item.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .page { display: none; padding: 20px; animation: fadeIn 0.2s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .field { 
            position: relative; width: 100%; aspect-ratio: 2/1; background: #111; 
            border: 1px solid #444; border-radius: 8px; margin: 15px 0;
            background-image: radial-gradient(circle at 50% 50%, #222 10%, transparent 11%);
        }
        .marker { position: absolute; width: 14px; height: 14px; background: var(--primary); border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid white; }
        .card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .counter-row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
        button { background: #222; color: white; border: 1px solid #444; border-radius: 6px; padding: 12px 20px; font-size: 1rem; touch-action: manipulation; }
        .btn-plus { background: var(--primary); color: black; font-weight: bold; width: 60px; }
        .btn-submit { background: var(--primary); color: black; width: 100%; padding: 18px; font-size: 1.1rem; margin-top: 20px; }
        input[type="number"] { background: #000; border: 1px solid #444; color: white; padding: 10px; width: 70px; border-radius: 4px; }
        .rating-btn { padding: 10px; margin: 2px; flex: 1; font-size: 0.8rem; }
        .rating-btn.active { background: var(--primary); color: black; }
        #qr_out img { margin: 0 auto; border: 10px solid white; border-radius: 5px; }
    </style>
</head>
<body>

<div class="nav">
    <div class="nav-item active" onclick="setTab(0)">PRE</div>
    <div class="nav-item" onclick="setTab(1)">AUTO</div>
    <div class="nav-item" onclick="setTab(2)">TELE</div>
    <div class="nav-item" onclick="setTab(3)">SUBJ</div>
    <div class="nav-item" onclick="setTab(4)">DATA</div>
</div>

<div class="page active" id="p0">
    <div class="card">
        <h3>Match Info</h3>
        <div class="counter-row">Match # <input type="number" id="m_num" value="1"></div>
        <div class="counter-row">Team # <input type="number" id="t_num"></div>
    </div>
    <p>Tap starting position:</p>
    <div class="field" onclick="setPos(event)"><div id="pos_dot"></div></div>
</div>

<div class="page" id="p1">
    <div class="card">
        <h3>Autonomous</h3>
        <div class="counter-row"><span>Fuel Scored</span> 
            <div><button onclick="add('a_fuel',-1)">-</button> <span id="v_a_fuel" style="margin:0 15px">0</span> <button class="btn-plus" onclick="add('a_fuel',1)">+</button></div>
        </div>
        <div class="counter-row"><span>Mobility</span> 
            <button id="v_mob" onclick="toggle('mob')">NO</button>
        </div>
    </div>
</div>

<div class="page" id="p2">
    <div class="card">
        <h3>Teleop Scoring</h3>
        <div class="counter-row"><span>Cycles</span> 
            <div><button onclick="add('t_cycles',-1)">-</button> <span id="v_t_cycles" style="margin:0 15px">0</span> <button class="btn-plus" onclick="add('t_cycles',1)">+</button></div>
        </div>
    </div>
    <div class="card">
        <h3>Endgame</h3>
        <div style="display:flex">
            <button id="cl1" class="rating-btn" onclick="setClimb(1)">L1</button>
            <button id="cl2" class="rating-btn" onclick="setClimb(2)">L2</button>
            <button id="cl3" class="rating-btn" onclick="setClimb(3)">L3</button>
        </div>
    </div>
</div>

<div class="page" id="p3">
    <div class="card">
        <h3>Driver Skill (1-5)</h3>
        <div style="display:flex">
            <button class="rating-btn sk" onclick="setRate(1)">1</button>
            <button class="rating-btn sk" onclick="setRate(2)">2</button>
            <button class="rating-btn sk" onclick="setRate(3)">3</button>
            <button class="rating-btn sk" onclick="setRate(4)">4</button>
            <button class="rating-btn sk" onclick="setRate(5)">5</button>
        </div>
    </div>
    <textarea id="notes" placeholder="Notes (Defense, breakdowns, etc.)" style="width:100%; height:80px; background:#000; color:white; border:1px solid #444; border-radius:5px; padding:10px; box-sizing: border-box;"></textarea>
    <button class="btn-submit" onclick="submitMatch()">SAVE MATCH DATA</button>
</div>

<div class="page" id="p4">
    <div class="card" style="text-align: center;">
        <h3>Sync to Google Sheet</h3>
        <p style="font-size: 0.8rem; color: #888;">Scan the QR below to auto-fill the form.</p>
        <div id="qr_out"></div>
    </div>
    <div id="history_list"></div>
    <button onclick="clearData()" style="width:100%; background: #444; margin-top:20px;">Clear History</button>
</div>

<script>
    let current = { a_fuel:0, mob:false, t_cycles:0, climb:0, skill:0, x:50, y:50 };
    let logs = JSON.parse(localStorage.getItem('scout_v2') || '[]');

    function setTab(idx) {
        document.querySelectorAll('.page').forEach((p, i) => p.classList.toggle('active', i === idx));
        document.querySelectorAll('.nav-item').forEach((n, i) => n.classList.toggle('active', i === idx));
        if(idx === 4) renderQR();
    }

    function add(key, val) { 
        current[key] = Math.max(0, current[key] + val); 
        document.getElementById('v_'+key).innerText = current[key]; 
    }

    function toggle(key) { 
        current[key] = !current[key]; 
        document.getElementById('v_'+key).innerText = current[key] ? "YES" : "NO"; 
    }

    function setPos(e) {
        const rect = e.currentTarget.getBoundingClientRect();
        current.x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
        current.y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
        document.getElementById('pos_dot').className = 'marker';
        document.getElementById('pos_dot').style.left = current.x + '%';
        document.getElementById('pos_dot').style.top = current.y + '%';
    }

    function setClimb(l) { 
        current.climb = l; 
        document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('cl'+l).classList.add('active');
    }

    function setRate(v) { 
        current.skill = v; 
        document.querySelectorAll('.sk').forEach((b,i) => b.classList.toggle('active', i+1 === v));
    }

    function submitMatch() {
        const data = {
            m: document.getElementById('m_num').value,
            t: document.getElementById('t_num').value,
            ...current,
            n: document.getElementById('notes').value
        };
        logs.push(data);
        localStorage.setItem('scout_v2', JSON.stringify(logs));
        alert("Match Saved Locally! Go to DATA tab to scan.");
        resetApp();
    }

    function resetApp() {
        current = { a_fuel:0, mob:false, t_cycles:0, climb:0, skill:0, x:50, y:50 };
        document.getElementById('v_a_fuel').innerText = "0";
        document.getElementById('v_t_cycles').innerText = "0";
        document.getElementById('v_mob').innerText = "NO";
        document.getElementById('notes').value = "";
        document.getElementById('t_num').value = "";
        document.getElementById('m_num').value++;
        setTab(0);
    }

    function renderQR() {
        const qrDiv = document.getElementById('qr_out');
        qrDiv.innerHTML = "";
        if(logs.length === 0) { qrDiv.innerText = "No data saved."; return; }
        
        const last = logs[logs.length - 1];
        const formBase = "https://docs.google.com/forms/d/e/1FAIpQLSfcdo2eN6BG1eJTxga1qmGy5sG_5jhnEpMpnCCoyuJqEJv3ww/viewform?usp=pp_url";
        
        // MAPPING TO YOUR SPECIFIC ENTRY IDs
        const params = 
            `&entry.425507163=${last.m}` +
            `&entry.377204325=${last.t}` +
            `&entry.2128680381=${last.a_fuel}` +
            `&entry.911321814=${last.mob ? "yes" : "no"}` +
            `&entry.2022696580=${last.t_cycles}` +
            `&entry.837351362=${last.climb}` +
            `&entry.171816958=${encodeURIComponent(last.n)}`;

        new QRCode(qrDiv, { text: formBase + params, width: 200, height: 200 });
        
        document.getElementById('history_list').innerHTML = `<p>History (${logs.length} matches saved locally)</p>` + 
            logs.map(l => `<div style="font-size:0.8rem; color:#888;">M${l.m} - T${l.t}</div>`).reverse().join('');
    }

    function clearData() { if(confirm("Delete all local history?")) { logs = []; localStorage.removeItem('scout_v2'); renderQR(); } }
</script>
</body>
</html>
